<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <title>Tienda Adidas</title>

        <h2>Productos nuevos</h2>
        <p>Conoce nuestros nuevos productos</p>
      </section>

      <section class="products">
        <article>
          <img src="./img/jersey.png" alt="jersey" />
          <h3>Jersey México 2025</h3>
          <p>$1000</p>
        </article>

        <article>
          <img src="./img/lg2.png" alt="LG2" />
          <h3>Adidas LG2</h3>
          <p>$2000</p>
        </article>

        <article>
          <img src="./img/chamarra.png" alt="chamarra" />
          <h3>Jersey México 2025</h3>
          <p>$1000</p>
        </article>

        <article>
          <img src="./img/lg2.png" alt="LG2" />

          <p>$2000</p>
        </article>

        <article>
          <img src="./img/jersey.png" alt="jersey" />
          <h3>Jersey México 2025</h3>
          <p>$1000</p>
        </article>

        <article>
          <img src="./img/chamarra.png" alt="chamarra" />
          <h3>Adidas LG2</h3>
          <p>$2000</p>
        </article>

        <article>
          <img src="./img/jersey.png" alt="jersey" />
          <h3>Jersey México 2025</h3>
          <p>$1000</p>
        </article>

        <article>
          <img src="./img/lg2.png" alt="LG2" />
          <h3>Adidas LG2</h3>
          <p>$2000</p>
        </article>
      </section>

      <section class="cart">
        <h2>CARRITO</h2>
        <div>
          <img src="./img/chamarra.png" alt="Icono quitar" />
          <p>chamarra</p>
          <p>$1,000</p>
          <i><img src="./img/trash-can.png" alt="Icono quitar" class="delete-icon"></i>
        </div>
      </section>
    </main>
  </body>
</html>
